# EuRoC stereo model

# intrinsic parameters after stereo-rectification are written
Camera:
  name: "NTU stereo"
  setup: "stereo"
  model: "perspective"

  # new "rectified" matrices is the first three cols of the projection matrix which is calculated with cv::stereoRectify()
  # e.g. fx = P1[0][0] or P2[0][0], cx = P1[0][2] or P2[0][2]
  #      fy = P1[1][1] or P2[1][1], cy = P1[1][2] or P2[1][2]

  fx: 399.18092010985185
  fy: 399.18092010985185
  cx: 279.0511817932129
  cy: 237.18554306030273

  # there is no distortion after stereo rectification

  k1: 0.0
  k2: 0.0
  p1: 0.0
  p2: 0.0
  k3: 0.0

  # focal_x_baseline is -P2[0][3] which is calculated with cv::stereoRectify()

  fps: 10.0
  cols: 752
  rows: 480
  focal_x_baseline: 103.94302889153853
  depth_threshold: 40

  color_order: "Gray"

# original intrinsic parameters (K, D) and stereo-recitification parameters (R)
# matrices (K, R) are written in row-major order

StereoRectifier:
  #       [fx,  0,  cx, 0,  fy, cy, 0,  0,  1]
  K_left: [428.8665684187201, 0.0, 386.9341560437303, 0.0, 430.5603722833283, 240.6006758583706, 0.0, 0.0, 1.0]
  # nput vector of distortion coefficients (k1,k2,p1,p2 [,k3[,k4,k5,k6[,s1,s2,s3,s4[,τx,τy]]]] )
  D_left: [-0.28636740491611073, 0.07286504511894751, 0.0011581722071279357, -0.0013929971974191318, 0.0]
  # Optional rectification transformation in the object space (3x3 matrix). 
  # R1 or R2 , computed by stereoRectify can be passed here. 
  # If the matrix is empty, the identity transformation is assumed. 
  # In initUndistortRectifyMap R is assumed to be an identity matrix. 
  R_left:
    [ 0.9967651446383735, 0.0014413139507382549, 0.0803565121700653, -0.0012768123487835765, 0.9999969830346869, -0.0020984927329331235, -0.0803592943241069, 0.00198910422542075, 0.9967639777199575]
  # R_left:
  #   [
  #     0.999966347530033,
  #     -0.001422739138722922,
  #     0.008079580483432283,
  #     0.001365741834644127,
  #     0.9999741760894847,
  #     0.007055629199258132,
  #     -0.008089410156878961,
  #     -0.007044357138835809,
  #     0.9999424675829176,
  #   ]
  K_right: [427.4796739530192, 0.0, 352.63697639568556, 0.0, 428.727026849965, 232.14628933694303, 0.0, 0.0, 1.0]
  D_right: [-0.3052270200790258, 0.09737608191566278, -0.00012104233884330579, 0.0003502622682745748, 0.0]
  R_right:
    [ 0.9957943510627114, 0.010559032244708074, 0.09100613841740969, -0.010745354946915118, 0.9999410538300042, 0.0015576303815164848, -0.09098432688468011, -0.0025289727946009198, 0.9958491133489781]
  # R_right:
  #   [
  #     0.9999633526194376,
  #     -0.003625811871560086,
  #     0.007755443660172947,
  #     0.003680398547259526,
  #     0.9999684752771629,
  #     -0.007035845251224894,
  #     -0.007729688520722713,
  #     0.007064130529506649,
  #     0.999945173484644,
  #   ]

Preprocessing:
  min_size: 800

Feature:
  name: "default ORB feature extraction setting"
  scale_factor: 1.2
  num_levels: 8
  ini_fast_threshold: 20
  min_fast_threshold: 7

Mapping:
  backend: "g2o"
  baseline_dist_thr: 0.11007784219
  redundant_obs_ratio_thr: 0.9
  erase_temporal_keyframes: false
  num_temporal_keyframes: 15

Tracking:
  backend: "g2o"
  enable_temporal_keyframe_only_tracking: false
  margin_last_frame_projection: 10.0

KeyframeInserter:
  wait_for_local_bundle_adjustment: false

Relocalizer:
  search_neighbor: true

LoopDetector:
  backend: "g2o"

Initializer:
  min_num_triangulated_pts: 100

System:
  map_format: "msgpack"
  num_grid_cols: 47
  num_grid_rows: 30

PangolinViewer:
  keyframe_size: 0.07
  keyframe_line_width: 1
  graph_line_width: 1
  point_size: 2
  camera_size: 0.08
  camera_line_width: 3
  viewpoint_x: 0
  viewpoint_y: -0.65
  viewpoint_z: -1.9
  viewpoint_f: 400
